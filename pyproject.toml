[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loosely-swahili"
version = "0.1.1"
description = "The premier NLP toolkit and morphological engine for East African Kenyan Code-Switching, Sheng, and Kiswahili."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Eminek-marz" }
]
keywords = [
    "nlp",
    "swahili",
    "kiswahili",
    "sheng",
    "kenya",
    "code-switching",
    "bantu-morphology",
    "east-africa",
    "african-nlp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
dependencies = [
    "tokenizers>=0.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "twine>=4.0.0",
    "build>=0.10.0"
]

[project.urls]
Homepage = "https://github.com/Eminek-marz/loosely-swahili"
Repository = "https://github.com/Eminek-marz/loosely-swahili"
"Bug Tracker" = "https://github.com/Eminek-marz/loosely-swahili/issues"

[tool.setuptools]
package-dir = {"loosely_swahili" = "src"}

[tool.setuptools.packages.find]
where = ["."]
include = ["loosely_swahili*"]
