[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loosely-swahili"
version = "0.3.0"
description = "The premier NLP toolkit, 125-rule morphological engine, and agentic workbench for East African Kenyan Code-Switching, Sheng, and Kiswahili."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Maxwell Ng'ang'a" }
]
keywords = [
    "nlp",
    "swahili",
    "kiswahili",
    "sheng",
    "kenya",
    "code-switching",
    "bantu-morphology",
    "east-africa",
    "african-nlp",
    "125-rules",
    "sheng-nlp",
    "anjiru-ai",
    "agentic-workbench"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]
dependencies = [
    "tokenizers>=0.13.0"
]

[project.scripts]
loosely-swahili = "loosely_swahili.anjiru_orchestrator:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "twine>=4.0.0",
    "build>=0.10.0"
]

[project.urls]
Homepage = "https://github.com/Eminek-marz/loosely-swahili"
Repository = "https://github.com/Eminek-marz/loosely-swahili"
"Bug Tracker" = "https://github.com/Eminek-marz/loosely-swahili/issues"

[tool.setuptools]
package-dir = {"loosely_swahili" = "src"}
packages = ["loosely_swahili", "loosely_swahili.sources", "loosely_swahili.data"]

[tool.setuptools.package-data]
"loosely_swahili" = ["data/*.json", "data/*.txt"]
"loosely_swahili.data" = ["*.json", "*.txt"]

